name: Validate Echo Isles source package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-source-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Echo Isles descriptors and GLB container
        run: python3 tools/validate_echo_isles.py
      - name: Reject game images
        shell: bash
        run: |
          if find . -type f \( -iname '*.iso' -o -iname '*.bin' \) | grep -q .; then
            echo "Unexpected game image found in repository."
            exit 1
          fi
